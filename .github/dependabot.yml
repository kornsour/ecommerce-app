version: 2
updates:
  # npm dependencies for the four services in this monorepo. There is no root
  # package.json (the root yarn.lock is a leftover stub), so each service is
  # listed explicitly. `directories` batches them into one grouped PR per week
  # instead of one per service — matching how the existing security PRs already
  # arrive ("Bump the npm_and_yarn group across 3 directories").
  #
  # Minor/patch are grouped and auto-merged once checks pass. Majors come as
  # individual PRs for manual review.
  - package-ecosystem: "npm"
    directories:
      - "/auth"
      - "/client"
      - "/tickets"
      - "/nats-test"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "kornsour"
    labels:
      - "dependencies"
    groups:
      # @types/* packages are split out deliberately. Dependabot reports a
      # group's update-type as the HIGHEST across its members, and these repos
      # carry companion type packages that lag badly behind their runtime
      # package (@types/jest was on 27 while jest was on 30). One such major
      # drags the whole group to semver-major, so the auto-merge workflow routes
      # the entire weekly batch to manual review and nothing merges itself.
      #
      # Listed first because the first matching group wins; exclude-patterns on
      # the catch-all below makes the split explicit either way. A stale type
      # package now only blocks the types batch, never the runtime one.
      types-minor-patch:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions pinned in workflows. Grouped so all action bumps arrive as one
  # PR, keeping CI runs (and minutes) to a minimum.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
